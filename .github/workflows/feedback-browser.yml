name: Feedback browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: feedback-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused feedback CPU tests
        run: pnpm exec tsx --test tests/feedback-outbox.test.ts tests/feedback-form.test.ts
      - name: Install matching Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run real React and native IndexedDB browser regression
        run: pnpm exec tsx scripts/feedback-browser.ts
