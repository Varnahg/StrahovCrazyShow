name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source and LFS assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test LFS asset preflight
        run: node --test tests/lfs-assets.test.ts

      - name: Check working LFS assets
        run: node scripts/check-lfs-assets.mjs

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0

      - name: Record verification identity
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD
          printf 'PR head: %s\nPR base: %s\n' "$PR_HEAD" "$PR_BASE"
          node --version
          pnpm --version
          git lfs fsck

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate agent task catalog
        run: node scripts/agent-tasks.mjs validate

      - name: Check README links
        run: pnpm check:readme

      - name: Run all tests
        run: pnpm test

      - name: Build production client
        run: pnpm build

      - name: Run isolated multiplayer integration
        run: pnpm test:integration
