name: Source secret hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify scanner behavior
        run: node --test tests/source-secret-hygiene.test.ts
      - name: Scan current source text
        run: node scripts/check-source-secrets.mjs
