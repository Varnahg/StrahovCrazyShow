# Optional server-only AI configuration. Use alongside compose.yaml.
services:
  game:
    environment:
      CRAZY_TYPKA_ENABLED: ${CRAZY_TYPKA_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      CRAZY_TYPKA_ALLOWED_ORIGINS: ${CRAZY_TYPKA_ALLOWED_ORIGINS:-}
      CRAZY_TYPKA_GENERATIONS_PER_PROCESS: ${CRAZY_TYPKA_GENERATIONS_PER_PROCESS:-500}
      CRAZY_TYPKA_EMBEDDINGS_PER_PROCESS: ${CRAZY_TYPKA_EMBEDDINGS_PER_PROCESS:-500}
      CRAZY_TYPKA_EMBEDDING_TOKEN_BUDGET: ${CRAZY_TYPKA_EMBEDDING_TOKEN_BUDGET:-500000}
