# Optional server-only AI configuration. Use alongside compose.yaml.
services:
  game:
    environment:
      CRAZY_TYPKA_ENABLED: ${CRAZY_TYPKA_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-}
      OPENAI_COMPLEX_MODEL: ${OPENAI_COMPLEX_MODEL:-gpt-6.1-sol}
      OPENAI_COMPLEX_REASONING_EFFORT: ${OPENAI_COMPLEX_REASONING_EFFORT:-low}
      CRAZY_TYPKA_DECISIONS_PER_PROCESS: ${CRAZY_TYPKA_DECISIONS_PER_PROCESS:-500}
      CRAZY_TYPKA_DECISION_TOKEN_BUDGET: ${CRAZY_TYPKA_DECISION_TOKEN_BUDGET:-1000000}
      CRAZY_TYPKA_COMPLEX_GENERATIONS_PER_PROCESS: ${CRAZY_TYPKA_COMPLEX_GENERATIONS_PER_PROCESS:-20}
      CRAZY_TYPKA_COMPLEX_THRESHOLD: ${CRAZY_TYPKA_COMPLEX_THRESHOLD:-0.80}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-3072}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RAG_MAX_COSINE_DISTANCE: ${RAG_MAX_COSINE_DISTANCE:-0.60}
      CRAZY_TYPKA_ALLOWED_ORIGINS: ${CRAZY_TYPKA_ALLOWED_ORIGINS:-}
      CRAZY_TYPKA_GENERATIONS_PER_PROCESS: ${CRAZY_TYPKA_GENERATIONS_PER_PROCESS:-500}
      CRAZY_TYPKA_EMBEDDINGS_PER_PROCESS: ${CRAZY_TYPKA_EMBEDDINGS_PER_PROCESS:-500}
      CRAZY_TYPKA_EMBEDDING_TOKEN_BUDGET: ${CRAZY_TYPKA_EMBEDDING_TOKEN_BUDGET:-500000}
