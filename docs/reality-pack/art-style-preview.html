<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Strahov • materiálová studie H</title>
    <style>
      body {
        margin: 0;
        background: #1b2528;
        color: #f4eee1;

      canvas {
        display: block;
        width: 100vw;
        height: calc(100vh - 110px);

      header {
        padding: 14px 22px;
        min-height: 82px;
      }
      button {
        margin: 8px 6px 0 0;

      }

      }

  <body>

        11.10.2026 · 12:00 Praha</button

      ><button id="clear">Jasno · náhled</button
      ><button id="overcast">Zataženo · náhled</button
      ><button id="low">Úsporná</button><button id="high">Vysoká</button
